[project]
name = "nanovisual-generation-service"
version = "0.1.0"
description = "NanoVisual Generation Engine service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29",
  "fastapi>=0.110",
  "google-genai>=0.4.0",
  "httpx>=0.27",
  "openai>=1.0",
  "pillow>=10.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
