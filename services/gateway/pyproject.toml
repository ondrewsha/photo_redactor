[project]
name = "nanovisual-gateway"
version = "0.1.0"
description = "NanoVisual API Gateway service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosmtplib>=3.0",
  "asyncpg>=0.29",
  "email-validator>=2.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
  "yookassa>=3.5.0",
  "motor>=3.7.1",
  "alembic>=1.11",
  "psycopg2-binary>=2.9"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
