
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NanoVisual - AI Image Generation</title>
    <script>
      if (typeof tailwind === 'undefined') {
        window.tailwind = {};
      }
      tailwind.config = tailwind.config || {};
      tailwind.config.darkMode = 'class';
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Geist', 'Inter', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      body.light, html.light body {
        background-color: #f8fafc;
        color: #0f172a;
      }
      body.dark, html.dark body {
        background-color: #020617;
        color: #f9fafb;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #27272a;
      }
      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .dark .glass {
        background: rgba(0, 0, 0, 0.4);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-zinc-950 dark:text-zinc-50">
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('nv_theme');
          const isDark = stored === 'dark';
          const root = document.documentElement;
          const body = document.body;
          const apply = (element) => {
            element.dataset.theme = isDark ? 'dark' : 'light';
            element.classList.toggle('dark', isDark);
            element.classList.toggle('light', !isDark);
            element.style.colorScheme = isDark ? 'dark' : 'light';
          };
          apply(root);
          apply(body);
        } catch (error) {
          // ignore, will fall back to default styles
        }
      })();
    </script>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
