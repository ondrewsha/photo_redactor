<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Политика конфиденциальности — NanoVisual</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
</head>
<body data-page="privacy" class="theme-dark">
  <style>
    /* Стили идентичны terms.html для единства дизайна */
    :root { color-scheme: dark; }
    body { margin: 0; background: var(--bg, #03030a); color: var(--text, #f8f8ff); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; transition: background 0.3s ease, color 0.3s ease; }
    body.theme-dark { --bg: #03030a; --text: #f8f8ff; --panel: #0b0b1f; --panel-alt: #101123; --border: rgba(255,255,255,0.08); --muted: #d4d4ff; --accent: #a5b4fc; --accent-strong: #7c3aed; }
    body.theme-light { --bg: #eef2ff; --text: #0f172a; --panel: #ffffff; --panel-alt: #fefcff; --border: rgba(99,102,241,0.2); --muted: #475569; --accent: #6366f1; --accent-strong: #4c1d95; }
    .page-shell { min-height: 100vh; display: flex; flex-direction: column; padding: 3rem 5vw; background: linear-gradient(180deg, var(--bg) 0%, #020205 45%, var(--bg) 100%); gap: 2rem; }
    .page-header { max-width: 960px; margin: 0 auto; }
    .page-header h1 { font-size: clamp(2.25rem, 3vw, 3rem); font-weight: 900; margin-bottom: 0.5rem; }
    .control-bar { display:flex; gap:1rem; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-top:1rem; }
    .control-bar button { padding: 0.65rem 1.5rem; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-weight: 600; cursor: pointer; }
    .lang-panel { position: absolute; top: calc(100% + 0.35rem); right: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 1rem; display: none; min-width: 140px; z-index: 10; }
    .lang-panel.show { display: block; }
    .lang-panel button { width: 100%; padding: 0.75rem 1.25rem; background: transparent; border: none; text-align: left; color: var(--text); cursor: pointer; }
    .service-list { display: grid; gap: 1.5rem; max-width: 960px; margin: 0 auto; }
    .service-card { background: var(--panel); border-radius: 1.5rem; padding: 2rem; border: 1px solid var(--border); }
    .service-card h2 { margin-top: 0; color: var(--accent); font-size: 1.5rem; }
    .service-card p, .service-card li { color: var(--text); line-height: 1.7; font-size: 0.95rem; }
  </style>
  <div class="page-shell">
    <header class="page-header">
      <p id="pageTagline"></p>
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
      <div class="control-bar">
        <div class="lang-switch" style="position:relative">
          <button id="langButton"></button>
          <div id="langPanel" class="lang-panel">
            <button data-locale="en">English</button>
            <button data-locale="ru">Русский</button>
          </div>
        </div>
        <button id="themeToggle"></button>
      </div>
    </header>
    <main id="content" class="service-list"></main>
  </div>
  <script>
    (function() {
      const translations = {
        en: {
          tagline: 'NanoVisual AI',
          title: 'Privacy Policy',
          subtitle: 'How we protect your personal and payment information.',
          themeToggle: { light: 'Light Theme', dark: 'Dark Theme' },
          sections: [
            { title: '1. Collected Data', paragraphs: ['We collect your email for authentication, generation history for your convenience, and technical logs for security.'] },
            { title: '2. Payment Security', paragraphs: ['All payments are processed by the certified provider YooKassa (PCI DSS compliant). We do not store your bank card details on our servers.'] },
            { title: '3. Data Storage', paragraphs: ['Your images are stored for 30 days. You can delete your account and all associated data at any time by contacting support.'] },
            { title: '4. Contact', paragraphs: ['Self-employed: [ВАШЕ ФИО], INN: [ВАШ ИНН], Email: support@nanovi.ru'] }
          ]
        },
        ru: {
          tagline: 'NanoVisual AI',
          title: 'Политика конфиденциальности',
          subtitle: 'Защита ваших данных — наш приоритет.',
          themeToggle: { light: 'Светлая тема', dark: 'Тёмная тема' },
          sections: [
            { title: '1. Какие данные мы собираем', paragraphs: ['Мы собираем только необходимые данные: ваш адрес электронной почты для авторизации, историю ваших промптов и сгенерированные изображения для доступа к ним в Личном кабинете.'] },
            { title: '2. Безопасность платежей', paragraphs: ['Прием платежей происходит через защищенное соединение платежного агрегатора ЮKassa. Сервис NanoVisual не получает и не хранит данные ваших банковских карт. Все операции соответствуют стандарту безопасности PCI DSS.'] },
            { title: '3. Использование файлов', paragraphs: ['Загруженные вами фотографии для референсов и результаты генераций хранятся в облачном хранилище в зашифрованном виде и доступны только вам. Мы не передаем ваш контент третьим лицам.'] },
            { title: '4. Согласие на обработку', paragraphs: ['Регистрируясь на сервисе, вы даете согласие на обработку персональных данных (email) в целях предоставления услуг сервиса.'] },
            { title: '5. Контакты', paragraphs: ['По вопросам обработки данных: support@nanovi.ru. Реквизиты: Самозанятый [ВАШЕ ФИО], ИНН [ВАШ ИНН].'] }
          ]
        }
      };

      const params = new URLSearchParams(window.location.search);
      const locale = translations[params.get('lang')] ? params.get('lang') : 'ru';
      const strings = translations[locale];

      document.getElementById('pageTagline').textContent = strings.tagline;
      document.getElementById('pageTitle').textContent = strings.title;
      document.getElementById('pageSubtitle').textContent = strings.subtitle;
      document.getElementById('langButton').textContent = locale === 'ru' ? 'Русский' : 'English';

      const content = document.getElementById('content');
      content.innerHTML = strings.sections.map(s => `
        <section class="service-card">
          <h2>${s.title}</h2>
          ${s.paragraphs.map(p => `<p>${p}</p>`).join('')}
        </section>
      `).join('');

      const themeToggle = document.getElementById('themeToggle');
      const applyTheme = (t) => {
        document.body.className = `theme-${t}`;
        themeToggle.textContent = t === 'dark' ? strings.themeToggle.light : strings.themeToggle.dark;
      };
      themeToggle.addEventListener('click', () => {
        const current = document.body.classList.contains('theme-dark') ? 'light' : 'dark';
        applyTheme(current);
      });
      applyTheme('dark');

      const lb = document.getElementById('langButton');
      const lp = document.getElementById('langPanel');
      lb.addEventListener('click', () => lp.classList.toggle('show'));
      lp.addEventListener('click', (e) => {
        if (e.target.dataset.locale) {
          params.set('lang', e.target.dataset.locale);
          window.location.search = params.toString();
        }
      });
    })();
  </script>
</body>
</html>
