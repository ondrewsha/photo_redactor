<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Условия использования — NanoVisual</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
</head>
<body data-page="terms" class="theme-dark">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: var(--bg, #03030a); color: var(--text, #f8f8ff); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; transition: background 0.3s ease, color 0.3s ease; }
    body.theme-dark { --bg: #03030a; --text: #f8f8ff; --panel: #0b0b1f; --panel-alt: #101123; --border: rgba(255,255,255,0.08); --muted: #d4d4ff; --accent: #a5b4fc; --accent-strong: #7c3aed; }
    body.theme-light { --bg: #eef2ff; --text: #0f172a; --panel: #ffffff; --panel-alt: #fefcff; --border: rgba(99,102,241,0.2); --muted: #475569; --accent: #6366f1; --accent-strong: #4c1d95; }
    .page-shell { min-height: 100vh; display: flex; flex-direction: column; padding: 3rem 5vw; background: linear-gradient(180deg, var(--bg) 0%, #020205 45%, var(--bg) 100%); gap: 2rem; }
    body.theme-light .page-shell { background: linear-gradient(180deg, var(--bg) 0%, #f5f5ff 60%, #ffffff 100%); }
    .page-header { max-width: 960px; margin: 0 auto; padding-bottom: 1rem; }
    .page-header h1 { font-size: clamp(2.25rem, 3vw, 3rem); font-weight: 900; margin-bottom: 0.5rem; }
    .page-header p { max-width: 720px; line-height: 1.7; color: var(--muted); margin-top: 0; margin-bottom: 0.25rem; }
    .control-bar { display:flex; gap:1rem; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-top:1rem; }
    .control-bar button { padding: 0.65rem 1.5rem; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-weight: 600; cursor: pointer; transition: 0.2s ease; }
    .control-bar button:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    .lang-panel { position: absolute; top: calc(100% + 0.35rem); right: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 1rem; box-shadow: 0 15px 40px rgba(0,0,0,0.25); overflow: hidden; z-index: 10; display: none; min-width: 140px; }
    .lang-panel.show { display: block; }
    .lang-panel button { width: 100%; padding: 0.75rem 1.25rem; background: transparent; border: none; text-align: left; color: var(--text); font-weight: 600; text-transform: uppercase; cursor: pointer; }
    .lang-panel button:hover { background: rgba(255,255,255,0.08); }
    .service-list { display: grid; gap: 1.5rem; max-width: 960px; margin: 0 auto; }
    .service-card { background: var(--panel); border-radius: 1.5rem; padding: 2rem; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    .service-card h2 { margin-top: 0; color: var(--accent); font-size: 1.5rem; }
    .service-card p, .service-card ul { color: var(--text); line-height: 1.7; font-size: 0.95rem; }
    .service-card ul { padding-left: 1.25rem; }
    .service-card a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
    .service-card a:hover { border-bottom-color: var(--accent); }
    body.theme-light .service-card { box-shadow: 0 25px 60px rgba(15, 23, 42, 0.12); }
  </style>
  <div class="page-shell">
    <header class="page-header">
      <p id="pageTagline"></p>
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
      <div class="control-bar">
        <div class="lang-switch" style="position:relative">
          <button id="langButton"></button>
          <div id="langPanel" class="lang-panel">
            <button data-locale="en">English</button>
            <button data-locale="ru">Русский</button>
          </div>
        </div>
        <button id="themeToggle"></button>
      </div>
    </header>
    <main id="content" class="service-list"></main>
  </div>
  <script>
    (function() {
      const translations = {
        en: {
          tagline: 'NanoVisual AI',
          title: 'Terms of Service',
          subtitle: 'Rules for using the generator and payment procedures.',
          themeToggle: { light: 'Light Theme', dark: 'Dark Theme' },
          sections: [
            { title: '1. Subject of Agreement', paragraphs: ['NanoVisual provides the User with access to an AI-based image generation service. The service is provided on an "as is" basis.'] },
            { title: '2. Payment and Delivery', paragraphs: [
              'The Service operates on a prepaid model. Users purchase "Generation Packs" (virtual credits).',
              'The moment of delivery: Digital credits are credited to the Users account balance automatically within 5-10 minutes after successful payment confirmation by the payment provider.',
              'Prices are listed in the calculator on the main page and in the Profile section.'
            ] },
            { title: '3. Refund Policy', paragraphs: [
              'According to the legislation on digital goods, a refund for a properly provided service (credits added to balance) is not possible as it is used immediately upon access.',
              'In case of a technical failure where credits were deducted but no image was created, please contact support at support@nanovi.ru.'
            ] },
            { title: '4. Rights and Responsibilities', paragraphs: ['The User is responsible for the prompts used. Prohibited: generation of illegal, violent, or copyright-infringing content.'] },
            { title: '5. Provider Details', paragraphs: [
              'Self-employed: [ВАШЕ ФИО]',
              'INN: [ВАШ ИНН]',
              'Contact: support@nanovi.ru',
              'Address: [ВАШ ГОРОД/АДРЕС]'
            ] }
          ]
        },
        ru: {
          tagline: 'NanoVisual AI',
          title: 'Пользовательское соглашение',
          subtitle: 'Публичная оферта об оказании услуг и правила использования сервиса.',
          themeToggle: { light: 'Светлая тема', dark: 'Тёмная тема' },
          sections: [
            { title: '1. Предмет соглашения', paragraphs: ['NanoVisual предоставляет Пользователю доступ к сервису генерации изображений на базе нейросетей. Сервис предоставляется по принципу «как есть» (as is).'] },
            { title: '2. Порядок оплаты и получения услуг', paragraphs: [
              'Услуги предоставляются по модели предоплаты. Пользователь приобретает пакеты «генераций» (виртуальных кредитов).',
              'Момент оказания услуги: Пополнение баланса аккаунта Пользователя происходит автоматически в течение 5-10 минут после подтверждения успешной транзакции платежной системой (ЮKassa).',
              'Все налоги включены в стоимость пакетов, указанных в калькуляторе на главной странице.'
            ] },
            { title: '3. Порядок возврата денежных средств', paragraphs: [
              'Согласно ст. 26.1 Закона РФ «О защите прав потребителей», возврат цифрового товара надлежащего качества после его получения (зачисления на баланс) невозможен, так как он имеет индивидуально-определенные свойства.',
              'При возникновении технического сбоя (списание кредита без выдачи результата) Пользователь имеет право на восстановление кредита через обращение в службу поддержки: support@nanovi.ru.'
            ] },
            { title: '4. Права на контент', paragraphs: ['Пользователь сохраняет за собой права на созданные изображения, при этом несет полную ответственность за соблюдение авторских прав третьих лиц при использовании входных данных (фото/промптов).'] },
            { title: '5. Реквизиты и контакты', paragraphs: [
              'Самозанятый: [ВАШЕ ФИО]',
              'ИНН: [ВАШ ИНН]',
              'E-mail: support@nanovi.ru',
              'Адрес: [ВАШ ГОРОД/АДРЕС]'
            ] }
          ]
        }
      };

      const params = new URLSearchParams(window.location.search);
      const locale = translations[params.get('lang')] ? params.get('lang') : 'ru';
      const strings = translations[locale];

      document.getElementById('pageTagline').textContent = strings.tagline;
      document.getElementById('pageTitle').textContent = strings.title;
      document.getElementById('pageSubtitle').textContent = strings.subtitle;
      document.getElementById('langButton').textContent = locale === 'ru' ? 'Русский' : 'English';

      const content = document.getElementById('content');
      content.innerHTML = strings.sections.map(s => `
        <section class="service-card">
          <h2>${s.title}</h2>
          ${s.paragraphs.map(p => `<p>${p}</p>`).join('')}
        </section>
      `).join('');

      // Theme toggle
      const themeToggle = document.getElementById('themeToggle');
      const applyTheme = (t) => {
        document.body.className = `theme-${t}`;
        themeToggle.textContent = t === 'dark' ? strings.themeToggle.light : strings.themeToggle.dark;
        localStorage.setItem('nv_theme', t);
      };
      themeToggle.addEventListener('click', () => {
        const current = document.body.classList.contains('theme-dark') ? 'light' : 'dark';
        applyTheme(current);
      });
      applyTheme(localStorage.getItem('nv_theme') || 'dark');

      // Lang switcher
      const lb = document.getElementById('langButton');
      const lp = document.getElementById('langPanel');
      lb.addEventListener('click', () => lp.classList.toggle('show'));
      lp.addEventListener('click', (e) => {
        if (e.target.dataset.locale) {
          params.set('lang', e.target.dataset.locale);
          window.location.search = params.toString();
        }
      });
    })();
  </script>
</body>
</html>
