name: nanovisual

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nanovisual}
      POSTGRES_USER: ${POSTGRES_USER:-nanovisual}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanovisual}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  prompt_service:
    build:
      context: .
      dockerfile: services/prompt_service/Dockerfile
    environment:
      PROMPT_SERVICE_LLM_PROVIDER: ${PROMPT_SERVICE_LLM_PROVIDER:-mock}
      PROMPT_SERVICE_INTERNAL_TOKEN: ${PROMPT_SERVICE_INTERNAL_TOKEN:-}
      PROMPT_SERVICE_OPENAI_API_KEY: ${PROMPT_SERVICE_OPENAI_API_KEY:-}
      PROMPT_SERVICE_OPENAI_BASE_URL: ${PROMPT_SERVICE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      PROMPT_SERVICE_OPENAI_MODEL: ${PROMPT_SERVICE_OPENAI_MODEL:-gpt-5-mini}
      PROMPT_SERVICE_OPENAI_PROXY_URL: ${PROMPT_SERVICE_OPENAI_PROXY_URL:-}
      PROMPT_SERVICE_OPENAI_PROXY_ENABLED: ${PROMPT_SERVICE_OPENAI_PROXY_ENABLED:-false}
      PROMPT_SERVICE_HTTP_TIMEOUT_S: ${PROMPT_SERVICE_HTTP_TIMEOUT_S:-30}
    ports:
      - "${PROMPT_SERVICE_PORT:-8001}:8000"
    restart: unless-stopped

  generation_service:
    build:
      context: .
      dockerfile: services/generation_service/Dockerfile
    environment:
      GEN_SERVICE_DATABASE_URL: "${GEN_SERVICE_DATABASE_URL:-postgresql+asyncpg://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB}"
      GEN_SERVICE_REDIS_URL: ${GEN_SERVICE_REDIS_URL:-redis://:${REDIS_PASSWORD_URLENC:-nanovisual_secret}@redis:6379/0}
      GEN_SERVICE_QUEUE_KEY: "${GEN_SERVICE_QUEUE_KEY:-$POSTGRES_DB:$POSTGRES_USER:queue:imggen}"
      GEN_SERVICE_MEDIA_ROOT: ${GEN_SERVICE_MEDIA_ROOT:-/data/media}
      GEN_SERVICE_PUBLIC_BASE_URL: ${GEN_SERVICE_PUBLIC_BASE_URL:-}
      GEN_SERVICE_IMAGE_PROVIDER: openrouter
      GEN_SERVICE_OPENROUTER_API_KEY: ${GEN_SERVICE_OPENROUTER_API_KEY:-}
      GEN_SERVICE_OPENROUTER_MODEL: ${GEN_SERVICE_OPENROUTER_MODEL:-google/gemini-2.0-pro-exp-02-05:free}
      GEN_SERVICE_HTTP_TIMEOUT_S: ${GEN_SERVICE_HTTP_TIMEOUT_S:-120}
      GEN_SERVICE_INTERNAL_TOKEN: ${GEN_SERVICE_INTERNAL_TOKEN:-}
      GEN_SERVICE_WORKER_ENABLED: ${GEN_SERVICE_WORKER_ENABLED:-true}
      GEN_SERVICE_OUTPUT_ENABLED: ${GEN_SERVICE_OUTPUT_ENABLED:-true}
      GEN_SERVICE_OUTPUT_FORMAT: ${GEN_SERVICE_OUTPUT_FORMAT:-webp}
      GEN_SERVICE_OUTPUT_QUALITY: ${GEN_SERVICE_OUTPUT_QUALITY:-85}
      GEN_SERVICE_OUTPUT_MAX_SIDE: ${GEN_SERVICE_OUTPUT_MAX_SIDE:-1280}
    volumes:
      - generation_media:/data/media
    ports:
      - "${GEN_SERVICE_PORT:-8002}:8000"
    depends_on:
      - postgres
      - redis
      - mongo
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      GATEWAY_PROMPT_SERVICE_URL: ${GATEWAY_PROMPT_SERVICE_URL:-http://prompt_service:8000}
      GATEWAY_GENERATION_SERVICE_URL: ${GATEWAY_GENERATION_SERVICE_URL:-http://generation_service:8000}
      GATEWAY_DATABASE_URL: "${GATEWAY_DATABASE_URL:-postgresql+asyncpg://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB}"
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:-redis://:${REDIS_PASSWORD_URLENC:-nanovisual_secret}@redis:6379/0}
      GATEWAY_MONGO_URL: ${GATEWAY_MONGO_URL:-mongodb://nanovisual_mongo:nanovisual_secret@mongo:27017/nanovisual_history?authSource=admin}
      GATEWAY_MONGO_DATABASE: ${GATEWAY_MONGO_DATABASE:-nanovisual_history}
      GATEWAY_MONGO_HISTORY_COLLECTION: ${GATEWAY_MONGO_HISTORY_COLLECTION:-generation_history}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-}
      GATEWAY_CORS_ALLOW_ORIGINS: ${GATEWAY_CORS_ALLOW_ORIGINS:-http://localhost:5173}
      GATEWAY_HTTP_TIMEOUT_S: ${GATEWAY_HTTP_TIMEOUT_S:-30}
      GATEWAY_DEBUG_ERRORS: ${GATEWAY_DEBUG_ERRORS:-false}
      GATEWAY_PUBLIC_BASE_URL: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:8080}
      GATEWAY_FRONTEND_BASE_URL: ${GATEWAY_FRONTEND_BASE_URL:-http://localhost:5173}
      GATEWAY_COOKIE_SECURE: ${GATEWAY_COOKIE_SECURE:-false}
      GATEWAY_COOKIE_DOMAIN: ${GATEWAY_COOKIE_DOMAIN:-}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-change-me}
      GATEWAY_JWT_TTL_MINUTES: ${GATEWAY_JWT_TTL_MINUTES:-20160}
      GATEWAY_SMTP_HOST: ${GATEWAY_SMTP_HOST:-}
      GATEWAY_SMTP_PORT: ${GATEWAY_SMTP_PORT:-587}
      GATEWAY_SMTP_USERNAME: ${GATEWAY_SMTP_USERNAME:-}
      GATEWAY_SMTP_PASSWORD: ${GATEWAY_SMTP_PASSWORD:-}
      GATEWAY_SMTP_FROM: ${GATEWAY_SMTP_FROM:-}
      GATEWAY_SMTP_USE_TLS: ${GATEWAY_SMTP_USE_TLS:-true}
      GATEWAY_GOOGLE_CLIENT_ID: ${GATEWAY_GOOGLE_CLIENT_ID:-}
      GATEWAY_GOOGLE_CLIENT_SECRET: ${GATEWAY_GOOGLE_CLIENT_SECRET:-}
      GATEWAY_GOOGLE_REDIRECT_URL: ${GATEWAY_GOOGLE_REDIRECT_URL:-}
      GATEWAY_PAYMENT_PROVIDER: ${GATEWAY_PAYMENT_PROVIDER:-mock}
      GATEWAY_YOOKASSA_SHOP_ID: ${GATEWAY_YOOKASSA_SHOP_ID:-}
      GATEWAY_YOOKASSA_SECRET_KEY: ${GATEWAY_YOOKASSA_SECRET_KEY:-}
      GATEWAY_YOOKASSA_RETURN_URL: ${GATEWAY_YOOKASSA_RETURN_URL:-}
      GATEWAY_YOOKASSA_WEBHOOK_SECRET: ${GATEWAY_YOOKASSA_WEBHOOK_SECRET:-}
      GATEWAY_ANTIFRAUD_REGISTER_IP_DAILY_LIMIT: ${GATEWAY_ANTIFRAUD_REGISTER_IP_DAILY_LIMIT:-5}
      GATEWAY_ANTIFRAUD_TRIAL_IP_DAILY_LIMIT: ${GATEWAY_ANTIFRAUD_TRIAL_IP_DAILY_LIMIT:-2}
      GATEWAY_ANTIFRAUD_TRIAL_DEVICE_LIMIT: ${GATEWAY_ANTIFRAUD_TRIAL_DEVICE_LIMIT:-1}
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    depends_on:
      - prompt_service
      - generation_service
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-/api}
    environment:
      - VITE_GATEWAY_URL=${VITE_GATEWAY_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - gateway
    restart: unless-stopped

  admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-/api}
    ports:
      - "${ADMIN_PORT:-5174}:80"
    depends_on:
      - gateway
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-nanovisual_mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-nanovisual_secret}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-nanovisual_history}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  generation_media:
  mongo_data:
