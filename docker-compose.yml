name: nanovisual

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nanovisual}
      POSTGRES_USER: ${POSTGRES_USER:-nanovisual}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanovisual}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  prompt_service:
    build:
      context: .
      dockerfile: services/prompt_service/Dockerfile
    environment:
      PROMPT_SERVICE_LLM_PROVIDER: ${PROMPT_SERVICE_LLM_PROVIDER:-mock}
      PROMPT_SERVICE_INTERNAL_TOKEN: ${PROMPT_SERVICE_INTERNAL_TOKEN:-}
      PROMPT_SERVICE_OPENAI_API_KEY: ${PROMPT_SERVICE_OPENAI_API_KEY:-}
      PROMPT_SERVICE_OPENAI_BASE_URL: ${PROMPT_SERVICE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      PROMPT_SERVICE_OPENAI_MODEL: ${PROMPT_SERVICE_OPENAI_MODEL:-gpt-5-mini}
      PROMPT_SERVICE_HTTP_TIMEOUT_S: ${PROMPT_SERVICE_HTTP_TIMEOUT_S:-30}
    ports:
      - "${PROMPT_SERVICE_PORT:-8001}:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
